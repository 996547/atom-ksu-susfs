name: Build atom KernelSU + SUSFS (cezanne-r-oss + WLAN)

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: '内核源码分支 (mt6873-dev/android_kernel_xiaomi_mt6885)'
        required: true
        default: 'cgroup-v2'
      VENDOR_BRANCH:
        description: 'MTK_kernel_modules 分支'
        required: true
        default: 'cezanne-r-oss'
      DEFCONFIG:
        description: 'Defconfig (相对 arch/arm64/configs/)'
        required: true
        default: 'vendor/atom_user_defconfig'
      WITH_SUSFS:
        description: '是否包含 SUSFS'
        required: true
        default: 'true'
      WITH_KSU:
        description: '是否包含 KernelSU'
        required: true
        default: 'true'
      WITH_PSTORE:
        description: '是否开启 pstore/ramoops (取证崩溃日志)'
        required: true
        default: 'true'
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout 本仓库 (取 ak3/ anykernel.sh + flash/ 修复脚本 + susu.tar.gz)
        uses: actions/checkout@v4
        with:
          path: action-repo

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make git curl zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: 克隆内核源码 (mt6873-dev/android_kernel_xiaomi_mt6885 @ cgroup-v2, 完整 atom/MT6873 树 + SukiSU 子模块, clang r383902)
        run: |
          git clone --single-branch --depth=1 \
            --branch "${{ github.event.inputs.KERNEL_BRANCH || 'cgroup-v2' }}" \
            https://github.com/mt6873-dev/android_kernel_xiaomi_mt6885.git kernel

      - name: 修补公开树缺失的 MTK 厂商头文件 (缩减无法编译的专有子系统)
        run: |
          cd kernel
          # 1) MMC: ComboA/ 顶层头 (sw-cqhci-crypto.h / msdc_reg.h 等) 被 ComboA/mt6873/mtk_sd.h
          #    以引号包含 (兄弟相对解析到 ComboA/mt6873/). 批量 -n 复制顶层 .h 到 mt6873/,
          #    只补缺的, 不覆盖平台专属文件 (如 mt6873/mtk_sd.h 自身)
          if [ -d drivers/mmc/host/mediatek/ComboA ]; then
            mkdir -p drivers/mmc/host/mediatek/ComboA/mt6873
            cp -n drivers/mmc/host/mediatek/ComboA/*.h \
                  drivers/mmc/host/mediatek/ComboA/mt6873/ 2>/dev/null || true
          fi
          # 2) PPM v3 被 obj-$(CONFIG_MACH_MT6873) 强制编入, 但 mtk_ppm_platform.h 公开树缺失 → 剔除 MT6873
          sed -i 's|^obj-$(CONFIG_MACH_MT6873) += ppm_v3/|#obj-$(CONFIG_MACH_MT6873) += ppm_v3/|g' \
            drivers/misc/mediatek/base/power/Makefile
          # 3) cameraisp 被 obj-y += cameraisp/ 无条件编入, met_events_camsys.h 公开树缺失 → 剔除
          sed -i 's|^obj-y += cameraisp/|#obj-y += cameraisp/|' \
            drivers/misc/mediatek/Makefile
          # 4) SWPM: mt6873 公开树缺失 mtk_swpm_platform.h, 且兄弟平台(mt6885)头与 mt6873 的
          #    mtk_swpm_platform.c 枚举/结构体尺寸不兼容 (DDR_2133、bw 数组 12 元素等),
          #    无法借用 → 整体剔除 swpm_v1 (SWPM 仅为功耗遥测/调试, 非启动必需).
          #    其父 Makefile 用 obj-$(CONFIG_MTK_SWPM) 门控, 注释即跳过 (CONFIG_MTK_SWPM 被
          #    Kconfig select 强制开启, 关 config 无效, 必须改 Makefile).
          sed -i 's|^obj-$(CONFIG_MTK_SWPM) += swpm_v1/|#obj-$(CONFIG_MTK_SWPM) += swpm_v1/|g' \
            drivers/misc/mediatek/base/power/Makefile
          # 5) UFS: ufs-mtk-platform.h 位于子目录 mediatek/mt6873/, 用引号包含 "ufs.h"/"ufshcd.h",
          #    但 UFS Makefile 的 -I 只指向 mediatek/mt6873 子目录本身, 父目录 drivers/scsi/ufs/
          #    (ufs.h/ufshcd.h 实际所在) 未加入包含路径 → 补 -I 使引号包含可解析
          sed -i '/drivers\/scsi\/ufs\/mediatek\//a ccflags-y += -I$(srctree)/drivers/scsi/ufs' \
            drivers/scsi/ufs/Makefile
          # 6) SELinux: 顶层 security/selinux/*.h 用引号包含 ss/ 子目录的头文件
          #    (sidtab.h / avtab.h / ebitmap.h / mls.h / constraint.h / context.h / services.h / ...),
          #    但 ss/ 头仅在 ss/ 内可解析 → 顶层找不到. 将 ss/*.h 全部符号链接到顶层目录
          #    (同名文件不存在时才建, 不覆盖已有真实文件), 一次性修好所有同类包含.
          if [ -d security/selinux/ss ]; then
            for h in security/selinux/ss/*.h; do
              b=$(basename "$h")
              [ -e "security/selinux/$b" ] || ln -snf "ss/$b" "security/selinux/$b"
            done
          fi
          # 7) Audio USIP: mtk-usip.c 无条件引用 IPI_MSG_A2D_GET_EMI_ADDRESS (仅
          #    CONFIG_MTK_AUDIO_ADSP_B 下定义, 已关闭) -> 从 Makefile 剔除编译.
          #    USIP 仅用于音频 DSP 通信, 缩减内核已关音频 DSP, 非启动必需.
          sed -i 's/\bmtk-usip\.o\b/#mtk-usip.o/' \
            sound/soc/mediatek/common/Makefile 2>/dev/null || true
          # 8) cm_mgr: mtk_cm_mgr_platform.c:992 将 cm_mgr_cpu_opp_to_dram 声明为 static,
          #    但 mtk_cm_mgr.h:81 声明为 extern -> 去掉 static 使声明匹配.
          sed -i 's/^static int cm_mgr_cpu_opp_to_dram/int cm_mgr_cpu_opp_to_dram/' \
            drivers/misc/mediatek/base/power/cm_mgr_v1/mt6873/mtk_cm_mgr_platform.c 2>/dev/null || true
          # 9) Audio AFE PCM: mt6873-afe-pcm.c 引用 mtk_dsp_irq_set_enable/disable
          #    (音频 DSP 函数, CONFIG_MTK_AUDIODSP_SUPPORT 已关) -> 从 Makefile 剔除.
          sed -i 's/\bmt6873-afe-pcm\.o\b/#mt6873-afe-pcm.o/' \
            sound/soc/mediatek/mt6873/Makefile 2>/dev/null || true
          # 10) DCM: step 12.5 用干净头覆盖了 #error 守卫的平台头, 但干净头仅含函数声明,
          #     丢失了寄存器常量 (MP_ADB_DCM_CFG0, CPU_PLLDIV_CFG0, MCUSYS_DCM_CFG0 等).
          #     mtk_dcm_autogen.c / mtk_dcm_internal.c 等多个源文件引用这些常量 ->
          #     整体排除 dcm_v1/mt6873/ 子目录. DCM 为动态时钟门控 (功耗优化), 非启动必需.
          sed -i 's|^\(obj-.*+= \)mt6873/|#\1mt6873/|' \
            drivers/misc/mediatek/base/power/dcm_v1/Makefile 2>/dev/null || true
          # 防御: 也排除 mt6873/Makefile 内所有 obj 行 (以防父 Makefile 用 obj-y 直接列 .o)
          sed -i 's|^\(obj-.*+=.*\)|#\1|' \
            drivers/misc/mediatek/base/power/dcm_v1/mt6873/Makefile 2>/dev/null || true

      - name: 下载 Clang r383902 (与原厂 4.14.186-perf 同源自 AOSP, clang 11.0.1)
        run: |
          mkdir -p "$HOME/clang"
          curl -L --max-time 300 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: 集成 KernelSU (SukiSU-Ultra nongki, 来自本仓库 susu.tar.gz)
        run: |
          cd kernel
          rm -rf KernelSU
          SU_SRC=$(tar -tzf ../action-repo/susu.tar.gz | head -1 | cut -d/ -f1)
          tar -xzf ../action-repo/susu.tar.gz
          mkdir -p KernelSU
          cp -a "$SU_SRC/." KernelSU/
          # 手动挂载进内核构建系统（nongki 不自带钩子，须显式挂）
          rm -rf drivers/kernelsu
          ln -sfn "../KernelSU/kernel" drivers/kernelsu
          if ! grep -q 'kernelsu/' drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          fi
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            python3 - <<'PY'
          import os
          p = "drivers/Kconfig"
          lines = open(p).read().splitlines(True)
          idx = max(i for i, l in enumerate(lines) if l.strip() == "endmenu")
          lines.insert(idx, 'source "drivers/kernelsu/Kconfig"\n')
          open(p, "w").writelines(lines)
          PY
          fi
          ls -l drivers/kernelsu/Makefile drivers/kernelsu/Kconfig

      - name: 应用 Clang 编译修复 (atom-sukisu 已验证配方)
        run: |
          cd kernel
          # 1) 顶层 Makefile 497 行: 注释 -no-integrated-as, 改用 integrated assembler
          sed -i 's/-no-integrated-as/#-no-integrated-as/' Makefile
          # 2) vdso gettimeofday.S: 去掉 clock_gettime_return 后的逗号 (3 处 call site, 缺失则跳过)
          [ -f arch/arm64/kernel/vdso/gettimeofday.S ] && \
            sed -i 's/clock_gettime_return, shift=1/clock_gettime_return shift=1/g' arch/arm64/kernel/vdso/gettimeofday.S || true
          # 3) connectivity Makefile: unlink -> rm -rf, ln -s -> ln -snf (mt6873-dev 布局可能不同, 缺失则跳过)
          [ -f drivers/misc/mediatek/connectivity/Makefile ] && \
            sed -i 's/$(shell unlink/$(shell rm -rf/g; s/ln -s /ln -snf /g' drivers/misc/mediatek/connectivity/Makefile || true
          # 4) AES 汇编补丁
          python3 ../action-repo/flash/patch_aes.py
          # 5) cpuidle-mediatek.c: 同目录头文件改引号 (缺失则跳过)
          [ -f drivers/cpuidle/cpuidle-mediatek.c ] && \
            sed -i 's|#include <dt_idle_states.h>|#include "dt_idle_states.h"|' drivers/cpuidle/cpuidle-mediatek.c || true
          # 6) 全局: 尖括号引用且同目录存在的本地头文件改引号
          python3 ../action-repo/flash/fix_angle_includes.py .
          # 6c) 单段尖括号本地头 (<name>, 无 '/') -> 改写为相对路径引号包含。
          #     上游 MTK 树大量驱动用尖括号包含本地头, 对应 Makefile 未加 -I$(src),
          #     Clang 报 'file not found with <angled> include; use quotes instead'。
          #     覆盖同目录 (helio-dvfsrc-qos.h) 与跨目录 (sspm/mt6873/*.h 包含 v2/*.h) 整类;
          #     候选仅限 drivers/techpack/vendor 下的 .h, 不碰 include/arch/usr 系统包含根。
          python3 ../action-repo/flash/fix_local_angle_includes.py .
          # 6b) 子目录文件用引号包含"父目录/兄弟目录"头文件 (如 ion/mtk/ion_drv.h 的 "ion.h"、
          #     lpm suspend 的 "mt6873.h")：Clang 下 -I 未含父目录 → file not found。
          #     在被包含文件所在目录建符号链接指向真实头文件(非复制, 避免链接头自身相对包含错位)。
          python3 ../action-repo/flash/fix_parent_quote_includes.py .
          # 7) MTK trace 头文件 TRACE_INCLUDE_PATH (Clang 兼容)
          python3 ../action-repo/flash/fix_trace_include_path.py .
          # 8) 缺失厂商固件打桩
          python3 ../action-repo/flash/stub_missing_firmware.py .
          # 9) 缺失引号头文件自动解析 (mt_iommu.h 等)
          python3 ../action-repo/flash/fix_missing_quote_includes.py .
          # 10) SukiSU syscall_fn_t 在 arm64 上未定义
          python3 ../action-repo/flash/fix_sukisu_syscall_fn_t.py .
          # 11) 4.14 缺 MODULE_IMPORT_NS 宏
          python3 ../action-repo/flash/fix_module_import_ns.py .
          # 12) 全局(drivers/)禁用 CONFIG_MEDIATEK_DRAMC 相关代码块(缩减内核策略):
          #     上游 mt6873 树缺失 drivers/misc/mediatek/dramc/mt6873/dramc.h
          #     (应声明 mtk_dramc_get_ddr_type / get_steps_freq / get_data_rate 及 TYPE_LPDDR* 枚举),
          #     而 CONFIG_MEDIATEK_DRAMC(带E, 孤儿符号)被开启, 致所有引用缺失符号的文件
          #     (helio-dvfsrc-v3/*, cm_mgr_v1/mt6873/mtk_cm_mgr_platform.c 等) 隐式声明/未声明错误。
          #     逐一 sed 已不够, 故对 drivers/ 全部 .c/.h 做三类替换, 强制走各文件自带
          #     stub / #else 分支, 规避缺失平台头。不碰 CONFIG_MTK_DRAMC(不带E)。
          #       ① #ifdef  CONFIG_MEDIATEK_DRAMC -> #if 0
          #       ② #ifndef CONFIG_MEDIATEK_DRAMC -> #if 1
          #       ③ defined(CONFIG_MEDIATEK_DRAMC) -> 0  (覆盖 #if defined() / #elif / #if !defined() 等)
          find drivers -type f \( -name '*.c' -o -name '*.h' \) -exec sed -i \
            -e 's|#ifdef CONFIG_MEDIATEK_DRAMC|#if 0 /* mt6873/dramc.h missing; use local stub */|g' \
            -e 's|#ifndef CONFIG_MEDIATEK_DRAMC|#if 1 /* use local stub */|g' \
            -e 's|defined(CONFIG_MEDIATEK_DRAMC)|0|g' \
            {} +
          # 12.5) DCM 修复 (鲁棒版): 上游 MTK DCM 头用项目宏守卫, 缺对应平台宏 -> #error 致编译失败.
          #       干净头 include/dcm_v1/mtk_dcm.h 仅含函数声明, 无 #error.
          #       策略: 在 drivers/ 内查找含该 #error 守卫的 mtk_dcm.h, 一律用干净头覆盖;
          #       干净头缺失则跳过. 同时诊断打印 dcm 头与 Makefile 供日志复盘.
          echo "===== dcm_v1/mt6873/mtk_dcm.h ====="; sed -n '1,30p' drivers/misc/mediatek/base/power/dcm_v1/mt6873/mtk_dcm.h 2>/dev/null || echo "(不存在)"
          echo "===== dcm_v1/Makefile ====="; cat drivers/misc/mediatek/base/power/dcm_v1/Makefile 2>/dev/null || true
          echo "===== dcm_v1/mt6873/Makefile ====="; cat drivers/misc/mediatek/base/power/dcm_v1/mt6873/Makefile 2>/dev/null || true
          SRC=drivers/misc/mediatek/base/power/include/dcm_v1/mtk_dcm.h
          if [ -f "$SRC" ]; then
            hits=$(grep -rl 'NO corresponding project of mtk_dcm.h' drivers/ 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "$hits" | while read -r f; do cp -f "$SRC" "$f"; echo "[ok] dcm: 用干净头覆盖 $f"; done
            else
              echo "[i] 未找到含 #error 守卫的 mtk_dcm.h (当前上游可能已无此问题)"
            fi
            # 防御: 将干净头铺到 dcm_v1/mt6873/ 与 dcm_v1/ 下, 防止引号包含/旧版阴影头解析到错误头
            [ -d drivers/misc/mediatek/base/power/dcm_v1/mt6873 ] && \
              cp -f "$SRC" drivers/misc/mediatek/base/power/dcm_v1/mt6873/mtk_dcm.h && \
              echo "[ok] dcm: 铺干净头到 dcm_v1/mt6873/mtk_dcm.h"
          else
            echo "[W] 干净头 $SRC 不存在, 跳过 dcm 修复"
          fi
          # 12) 4.14 KSU 通用适配 (pgtable.h / ksys_ / strncpy_from_user_nofault)
          python3 ../action-repo/flash/fix_ksu_414_generic.py .
          # 13) lsm_hook.c 在 4.14 的适配 (hlist -> list_head)
          python3 ../action-repo/flash/fix_lsm_hook_414.py .

      - name: 集成 SUSFS (gitlab.com/simonpunk/susfs4ksu)
        if: ${{ github.event.inputs.WITH_SUSFS != 'false' }}
        run: |
          cd kernel
          git clone --depth 1 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs_src
          KP="../susfs_src/kernel_patches"
          # (a) 拷贝 SUSFS 核心源文件
          cp -a "$KP/fs/susfs.c"            fs/susfs.c            2>/dev/null || echo "[W] copy fs/susfs.c failed"
          cp -a "$KP/include/linux/susfs.h" include/linux/susfs.h 2>/dev/null || echo "[W] copy susfs.h failed"
          # (b) 内核侧补丁：VFS 钩子 + fs/Makefile 条目
          patch -p1 --forward < "$KP/50_add_susfs_in_kernel-4.14.patch" 2>&1 | grep -iE "fail|rej" || true
          # (c) KernelSU 侧补丁
          patch -p1 --forward -d KernelSU < "$KP/KernelSU/10_enable_susfs_for_ksu.patch" 2>&1 | grep -iE "fail|rej" || true
          # (d) 消除 kernel_compat.h 宏与函数同名冲突
          sed -i -E 's/^(\s*)(int ksu_access_ok\(const void \*addr, unsigned long size\) \{)/\1#undef ksu_access_ok\n\1\2/' \
            KernelSU/kernel/kernel_compat.c
          # (e) 手动补 selinux/rules.c 的 zygote unmount 规则 (SUSFS try_umount 所需)
          python3 - <<'PY' 2>/dev/null || true
          p = "KernelSU/kernel/selinux/rules.c"
          try:
              s = open(p).read()
              if "labeledfs" not in s:
                  anchor = 'ksu_allow(db, "system_server", KERNEL_SU_DOMAIN, "process", "sigkill");'
                  ins = anchor + "\n\n#ifdef CONFIG_KSU_SUSFS\n\tksu_allow(db, \"zygote\", \"labeledfs\", \"filesystem\", \"unmount\");\n#endif\n"
                  s = s.replace(anchor, ins, 1)
                  open(p, "w").write(s)
                  print("    [ok] selinux SUSFS 规则已补入")
          except Exception as e:
              print("    [W] selinux 规则补入失败:", e)
          PY
          # (f) 补 path_umount()：atom 4.14.186 厂商树未提供，fs/susfs.c 需要
          if grep -q "int path_umount(struct path \*path, int flags)" fs/namespace.c; then
            echo "    [skip] path_umount 已存在"
          else
            cat >> fs/namespace.c <<'EOF'

          #ifdef CONFIG_KSU_SUSFS
          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	return do_umount(mnt, flags);
          }
          EXPORT_SYMBOL(path_umount);
          #endif
          EOF
            echo "    [ok] path_umount() 已补入 fs/namespace.c"
          fi
          # (g) 手动补 faccessat 的 SUS_PATH 钩子
          python3 - <<'PY2' 2>/dev/null || echo "    [W] faccessat SUS_PATH 钩子补入失败"
          import re
          p = "fs/open.c"
          s = open(p).read()
          m = re.search(r'SYSCALL_DEFINE3\(faccessat.*?\n\{\n(.*?)\n\}', s, re.S)
          if m:
              fn = m.group(0)
              if 'susfs_sus_path_by_filename' not in fn:
                  fn2 = fn.replace('unsigned int lookup_flags = LOOKUP_FOLLOW;\n',
                      'unsigned int lookup_flags = LOOKUP_FOLLOW;\n'
                      '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n'
                      '\tstruct filename* fname;\n'
                      '\tint status;\n'
                      '\tint error;\n'
                      '\tfname = getname_safe(filename);\n'
                      '\tstatus = susfs_sus_path_by_filename(fname, &error, SYSCALL_FAMILY_ALL_ENOENT);\n'
                      '\tputname_safe(fname);\n'
                      '\tif (status) {\n'
                      '\t\treturn error;\n'
                      '\t}\n'
                      '#endif\n', 1)
                  s = s[:m.start()] + fn2 + s[m.end():]
                  open(p, "w").write(s)
                  print("    [ok] faccessat SUS_PATH 钩子已补入")
              else:
                  print("    [skip] faccessat 已有 SUS_PATH 钩子")
          else:
              print("    [W] 未找到 faccessat 函数")
          PY2

      - name: 生成 defconfig 并开启 KSU / SUSFS / 关闭 APPENDED_DTB
        run: |
          cd kernel
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          make ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- MTK_PLATFORM=mt6873 \
            "${{ github.event.inputs.DEFCONFIG || 'vendor/atom_user_defconfig' }}"
          # KernelSU 所需
          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KPROBES
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL
          # SUSFS (默认开)
          if [ "${{ github.event.inputs.WITH_SUSFS }}" != "false" ]; then
            scripts/config --enable CONFIG_KSU_SUSFS
            scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
            scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
            scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT
          else
            scripts/config --disable CONFIG_KSU_SUSFS || true
          fi
          # pstore/ramoops (取证用, 默认开)
          if [ "${{ github.event.inputs.WITH_PSTORE }}" != "false" ]; then
            scripts/config --enable CONFIG_PSTORE
            scripts/config --enable CONFIG_PSTORE_RAM
          fi
          # 关闭 STRONG stack-protector (Clang 兼容)
          scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG || true
          # 关键: 关闭 appended DTB, 产出纯 Image.gz (设备用 dtbo 分区提供 DTB)
          scripts/config --disable CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          # 禁用 FTS/FocalTech 触摸驱动 (厂商私有固件 blob 缺失); 实机固件由 vendor 分区加载
          scripts/config --disable CONFIG_TOUCHSCREEN_FTS || true
          scripts/config --disable CONFIG_TOUCHSCREEN_FTS_FOD || true
          # 缩减公开树缺失厂商头文件的子系统
          # SWPM: 已在修补步骤 4 整体剔除 swpm_v1 (mt6873 公开树缺平台头且兄弟头不兼容); 此处关 GPU_SWPM 降运行期风险
          scripts/config --disable CONFIG_MTK_SWPM || true
          scripts/config --disable CONFIG_MTK_GPU_SWPM_SUPPORT || true
          # 相机/CCU: 相关头 (met_events_camsys.h 等) 缺失, 已从父 Makefile 剔除 cameraisp; 一并关配置
          scripts/config --disable CONFIG_MTK_IMGSENSOR || true
          scripts/config --disable CONFIG_MTK_CCU || true
          scripts/config --disable CONFIG_MEDIA_CAMERA_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_RSC_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_DPE_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_TSF_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_FD_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_WPE_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_OWE_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_MFB_SUPPORT || true
          scripts/config --unset CONFIG_CUSTOM_KERNEL_IMGSENSOR || true
          # 关闭 wlan/bt/fm/gps 一体编译 (CONFIG_WLAN_DRV_BUILD_IN): 该 MTK 闭源驱动
          # 在 Clang 下存在大量 incomplete-type / -Wvisibility 真实错误, 且与启动无关;
          # 缩减内核策略下关闭, 仅保留无条件编译的 connadp 适配层 (不引用 wlan 符号).
          scripts/config --disable CONFIG_WLAN_DRV_BUILD_IN || true
          # 关键: 强制 MTK_PLATFORM=mt6873 (公开重建树默认/错误地解析为 mt6853,
          #   导致 smi/smi_port.h 链拉进 mt6853-larb-port.h, 与 mmdvfs/mdp 直接包含的
          #   mt6873-larb-port.h 宏重名 -> -Werror 重定义; 同时影响 disp/vdec/venc/m4u/iommu 等).
          scripts/config --set-str CONFIG_MTK_PLATFORM "mt6873" || true
          # ION 暂存驱动在公开树缺 mtk/ion.h 与 uapi/ion.h (404), 无法编译 -> 关闭.
          #   (ION 为 deprecated staging, KernelSU/SUSFS 不依赖; 实机图形缓冲由 vendor 分区驱动提供)
          scripts/config --disable CONFIG_ION || true
          scripts/config --disable CONFIG_STAGING_ION || true
          scripts/config --disable CONFIG_MTK_ION || true
          scripts/config --disable CONFIG_MTK_ION_DEBUG || true
          # 音频 DSP 双核(A/B): 缩减内核未开 ADSP_B, 但 audio_ipi/audio_dsp 代码无条件引用
          #   ADSP_B_ID / ADSP_B_IPI_DMA_MEM_ID (仅 CONFIG_MTK_AUDIO_ADSP_B 下定义) -> undeclared 错误。
          #   音频 DSP 非启动必需, 关闭以整体编译掉这些代码路径
          #   (audio_ipi_platform.c 的 HIFI3_B 块由 CONFIG_MTK_AUDIODSP_SUPPORT 守卫;
          #    dsp-platform-mem-control.o 由 CONFIG_SND_SOC_MTK_AUDIO_DSP 门控)。
          scripts/config --disable CONFIG_MTK_AUDIODSP_SUPPORT || true
          scripts/config --disable CONFIG_MTK_AUDIO_CM4_SUPPORT || true
          scripts/config --disable CONFIG_MTK_AUDIO_ADSP_B || true
          scripts/config --disable CONFIG_SND_SOC_MTK_AUDIO_DSP || true
          make ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- MTK_PLATFORM=mt6873 olddefconfig

      - name: 编译内核 (纯 Image.gz, KSU+SUSFS 已内建)
        run: |
          cd kernel
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          make ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- MTK_PLATFORM=mt6873 \
            Image.gz -j"$(nproc)"

      - name: 校验产物 Image.gz (纯内核, 无 appended DTB) + KSU/SUSFS 是否存在
        run: |
          cd kernel
          ls -lh arch/arm64/boot/Image.gz
          python3 - <<'PY'
          import gzip
          data = open('arch/arm64/boot/Image.gz','rb').read()
          raw = gzip.decompress(data)
          print("decompressed kernel size:", len(raw))
          print("appended DTB present:", b'\xd0\x0d\xfe\xed' in raw)
          print("KernelSU strings:", raw.count(b'KernelSU'))
          print("susfs strings:", raw.lower().count(b'susfs'))
          assert raw.count(b'KernelSU') > 0, "KernelSU NOT compiled in!"
          PY

      - name: 打包 AnyKernel3 (纯 Image.gz, 保留设备 ramdisk/dtbo)
        run: |
          ZIPNAME="atom-ksu-susfs-AnyKernel3.zip"
          rm -rf AK3 && mkdir -p AK3
          cp action-repo/ak3/anykernel.sh AK3/anykernel.sh
          cp action-repo/ak3/META-INF AK3/ -r
          cp action-repo/ak3/tools AK3/ -r
          cp kernel/arch/arm64/boot/Image.gz AK3/Image.gz
          cd AK3 && zip -r "../$ZIPNAME" . -x '*.git*'
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

      - name: 上传构建产物 (供 monitor 脚本下载)
        uses: actions/upload-artifact@v4
        with:
          name: atom-ksu-susfs-AnyKernel3
          path: atom-ksu-susfs-AnyKernel3.zip
