name: Build atom KernelSU + SUSFS (cezanne-r-oss + WLAN)

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: '内核源码分支 (mt6873-dev/android_kernel_xiaomi_mt6885)'
        required: true
        default: 'cgroup-v2'
      VENDOR_BRANCH:
        description: 'MTK_kernel_modules 分支'
        required: true
        default: 'cezanne-r-oss'
      DEFCONFIG:
        description: 'Defconfig (相对 arch/arm64/configs/)'
        required: true
        default: 'vendor/atom_user_defconfig'
      WITH_SUSFS:
        description: '是否包含 SUSFS'
        required: true
        default: 'true'
      WITH_KSU:
        description: '是否包含 KernelSU'
        required: true
        default: 'true'
      WITH_PSTORE:
        description: '是否开启 pstore/ramoops (取证崩溃日志)'
        required: true
        default: 'true'
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout 本仓库 (取 ak3/ anykernel.sh + flash/ 修复脚本 + susu.tar.gz)
        uses: actions/checkout@v4
        with:
          path: action-repo

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make git curl zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: 克隆内核源码 (mt6873-dev/android_kernel_xiaomi_mt6885 @ cgroup-v2, 完整 atom/MT6873 树 + SukiSU 子模块, clang r383902)
        run: |
          git clone --single-branch --depth=1 \
            --branch "${{ github.event.inputs.KERNEL_BRANCH || 'cgroup-v2' }}" \
            https://github.com/mt6873-dev/android_kernel_xiaomi_mt6885.git kernel

      - name: 修补公开树缺失的 MTK 厂商头文件 (缩减无法编译的专有子系统)
        run: |
          cd kernel
          # 1) MMC: ComboA/ 顶层头 (sw-cqhci-crypto.h / msdc_reg.h 等) 被 ComboA/mt6873/mtk_sd.h
          #    以引号包含 (兄弟相对解析到 ComboA/mt6873/). 批量 -n 复制顶层 .h 到 mt6873/,
          #    只补缺的, 不覆盖平台专属文件 (如 mt6873/mtk_sd.h 自身)
          if [ -d drivers/mmc/host/mediatek/ComboA ]; then
            mkdir -p drivers/mmc/host/mediatek/ComboA/mt6873
            cp -n drivers/mmc/host/mediatek/ComboA/*.h \
                  drivers/mmc/host/mediatek/ComboA/mt6873/ 2>/dev/null || true
          fi
          # 2) PPM v3 被 obj-$(CONFIG_MACH_MT6873) 强制编入, 但 mtk_ppm_platform.h 公开树缺失 → 剔除 MT6873
          sed -i 's|^obj-$(CONFIG_MACH_MT6873) += ppm_v3/|#obj-$(CONFIG_MACH_MT6873) += ppm_v3/|g' \
            drivers/misc/mediatek/base/power/Makefile
          # 3) cameraisp 被 obj-y += cameraisp/ 无条件编入, met_events_camsys.h 公开树缺失 → 剔除
          sed -i 's|^obj-y += cameraisp/|#obj-y += cameraisp/|' \
            drivers/misc/mediatek/Makefile
          # 4) SWPM: mt6873 公开树缺失 mtk_swpm_platform.h, 且兄弟平台(mt6885)头与 mt6873 的
          #    mtk_swpm_platform.c 枚举/结构体尺寸不兼容 (DDR_2133、bw 数组 12 元素等),
          #    无法借用 → 整体剔除 swpm_v1 (SWPM 仅为功耗遥测/调试, 非启动必需).
          #    其父 Makefile 用 obj-$(CONFIG_MTK_SWPM) 门控, 注释即跳过 (CONFIG_MTK_SWPM 被
          #    Kconfig select 强制开启, 关 config 无效, 必须改 Makefile).
          sed -i 's|^obj-$(CONFIG_MTK_SWPM) += swpm_v1/|#obj-$(CONFIG_MTK_SWPM) += swpm_v1/|g' \
            drivers/misc/mediatek/base/power/Makefile
          # 5) UFS: ufs-mtk-platform.h 位于子目录 mediatek/mt6873/, 用引号包含 "ufs.h"/"ufshcd.h",
          #    但 UFS Makefile 的 -I 只指向 mediatek/mt6873 子目录本身, 父目录 drivers/scsi/ufs/
          #    (ufs.h/ufshcd.h 实际所在) 未加入包含路径 → 补 -I 使引号包含可解析
          sed -i '/drivers\/scsi\/ufs\/mediatek\//a ccflags-y += -I$(srctree)/drivers/scsi/ufs' \
            drivers/scsi/ufs/Makefile
          # 6) SELinux: 顶层 security/selinux/*.h 用引号包含 ss/ 子目录的头文件
          #    (sidtab.h / avtab.h / ebitmap.h / mls.h / constraint.h / context.h / services.h / ...),
          #    但 ss/ 头仅在 ss/ 内可解析 → 顶层找不到. 将 ss/*.h 全部符号链接到顶层目录
          #    (同名文件不存在时才建, 不覆盖已有真实文件), 一次性修好所有同类包含.
          if [ -d security/selinux/ss ]; then
            for h in security/selinux/ss/*.h; do
              b=$(basename "$h")
              [ -e "security/selinux/$b" ] || ln -snf "ss/$b" "security/selinux/$b"
            done
          fi
          # 7) Audio USIP: mtk-usip.c 无条件引用 IPI_MSG_A2D_GET_EMI_ADDRESS (仅
          #    CONFIG_MTK_AUDIO_ADSP_B 下定义, 已关闭) -> 从 Makefile 剔除编译.
          #    USIP 仅用于音频 DSP 通信, 缩减内核已关音频 DSP, 非启动必需.
          sed -i 's/\bmtk-usip\.o\b/#mtk-usip.o/' \
            sound/soc/mediatek/common/Makefile 2>/dev/null || true
          # 8) cm_mgr: mtk_cm_mgr_platform.c:992 将 cm_mgr_cpu_opp_to_dram 声明为 static,
          #    但 mtk_cm_mgr.h:81 声明为 extern -> 去掉 static 使声明匹配.
          sed -i 's/^static int cm_mgr_cpu_opp_to_dram/int cm_mgr_cpu_opp_to_dram/' \
            drivers/misc/mediatek/base/power/cm_mgr_v1/mt6873/mtk_cm_mgr_platform.c 2>/dev/null || true
          # 9) Audio: 缩减内核已关音频 DSP (CONFIG_MTK_AUDIODSP_SUPPORT 等), 但 mt6873 音频
          #    平台代码仍被编入 (mt6873-afe-pcm.c 引用 mtk_dsp_irq_*; 复合对象
          #    snd-soc-mt6873-afe.o 的成员行被注释后 obj 行仍在 -> no rule to make target).
          #    整体排除 mt6873 音频平台目录. sound/soc/mediatek/common/ (通用层) 保留.
          sed -i '/mt6873\//s/^\(obj-\)/#\1/' sound/soc/mediatek/Makefile 2>/dev/null || true
          # 防御: mt6873 子 Makefile 内所有 obj 行也注释
          sed -i 's/^\(obj-.*\)$/#\1/' sound/soc/mediatek/mt6873/Makefile 2>/dev/null || true
          # 10) DCM: step 12.5 干净头覆盖后丢失寄存器常量, mt6873 子目录多文件 (autogen/internal)
          #     引用常量报 undeclared; 排除子目录后父 Makefile 仍按 $(MTK_PLATFORM) 变量归档
          #     mt6873/built-in.o (字面 sed 匹配不到变量行) -> 从 base/power/Makefile
          #     整体排除 dcm_v1/. DCM 为动态时钟门控(功耗优化), 非启动必需.
          sed -i '/dcm_v1\//s/^\(obj-\)/#\1/' \
            drivers/misc/mediatek/base/power/Makefile 2>/dev/null || true
          # 10.5) 全面平台转发层 (Class A 根因的系统性解法, 取代逐个 whack-a-mole):
          #     公开 MTK 树几乎每个平台头都有 mt6785/mt6853/mt6873/mt6885 多份变体, 本应由 -I
          #     按 MTK_PLATFORM 选择. 但 (a) 共享头硬编码错误平台 include、(b) 个别模块 -I 默认
          #     解析到 mt6853 (arch/arm64/Makefile 虽从 CONFIG_MTK_PLATFORM 派生 MTK_PLATFORM=mt6873,
          #     仍有模块 -I 顺序异常), 导致每次编译都冒出新的"宏重定义/类型冲突/隐式声明".
          #     脚本遍历 include/ 与 drivers/misc/mediatek/, 对【每个存在 mt6873 等价头】的非 mt6873
          #     平台头改写为对 mt6873 等价头的薄转发 (保留原 guard, 备份 .orig, 幂等). 效果: 无论 -I
          #     顺序或硬编码 include 把非 mt6873 头解析到哪, 最终都落到 mt6873 的 guarded 内容,
          #     同名宏/类型只定义一次. 未被动到的头不参与编译=无害; 需回滚时用 *.orig.
          #     注: gpufreq 的 mt6785/mtk_gpufreq.h 无 mt6873 等价 (等价在 gpufreq_v1/mt6873/),
          #     本脚本自动跳过, 仍由下方 #11 专门处理.
          python3 ../action-repo/flash/fix_platform_forward_all.py include drivers/misc/mediatek
          # 11) gpufreq 双定义 (mt6873 结构性, 根因修复):
          #     include/mtk_gpufreq.h 同时 #include "gpufreq_v1/mtk_gpufreq.h" (v1 链, 含 mt6873
          #     plat 的 struct/typedef/函数定义) 与 "#include ../mt6785/mtk_gpufreq.h" (mt6785 旧头,
          #     不同 guard _MT_GPUFREQ_H_, 也定义同名 mt_gpufreq_target / gpufreq_power_limit_notify
          #     / gpufreq_input_boost_notify). 两 guard 不同, 任一 TU 同时拉入即 conflicting types /
          #     redefinition of typedef. 干净修复: 让 include/mtk_gpufreq.h 只走 v1 链 ->
          #     删除 mt6785 include 行. (mtk_pbm.c 等被 fix_local_angle_includes.py 改写为
          #     "../mt6785/..." 的引用, 在"应用 Clang 编译修复"步骤末尾 #6d 统一还原为 <mtk_gpufreq.h>.)
          #     注意: 实际共享头不在顶层 include/ 下 (直删 include/mtk_gpufreq.h 曾报 No such file
          #     致步骤整体失败). 故动态查找树内一切含 mt6785/mtk_gpufreq.h 的头文件, 删除其
          #     mt6785 include 行 —— mt6873 构建本就不应拉入 mt6785 平台头, 强行只走 v1 链.
          for f in $(grep -rl "mt6785/mtk_gpufreq.h" --include=*.h . 2>/dev/null); do
            echo "[gpufreq] remove mt6785 include from $f"
            sed -i '\|#include.*mt6785/mtk_gpufreq.h|d' "$f"
          done
          # 11b) mt6785 旧 gpufreq 头 -> 转发到 v1 mt6873 plat 头 (结构性修复, 替代逐符号打补丁).
          #      凡直接 #include base/power/mt6785/mtk_gpufreq.h 的 .c (ged_kpi.c /
          #      Mali mtk_platform_common.c / mali_kbase_gpuprops.c ...) 都会踩该旧头的缺失:
          #        - 缺 18 个 extern (get_shader_present / get_limit_user / bringup / ...)
          #        - 缺全部 5 个 enum (mt_gpufreq_kicker[含 KIR_POLICY] / mt_power_state /
          #          mt_cg_state / mt_mtcmos_state / mt_buck_state) —— 旧头一个 enum 都没有
          #        - mt_gpufreq_target 签名不兼容: 旧头 (unsigned int, bool is_real_idx) vs
          #          v1 (unsigned int, enum mt_gpufreq_kicker). Mali 传 KIR_POLICY(=8) 在 bool
          #          声明下会被静默转成 1(=KIR_PROC) —— 行为错误, 非仅编译问题.
          #      逐个补声明是打地鼠 (已连吃 get_limit_user / KIR_POLICY / get_shader_present 三轮),
          #      故改为让旧头只 #include v1 plat 头 => 全树唯一定义点, 一次性消除
          #      "缺符号 / 缺 enum / 签名不一致 / 重复定义" 四类问题.
          #      脚本会动态保留旧头独有的 7 个符号 (g_mfg_lock / power_control_enable/disable /
          #      aee_rr_*) 与 #define, 并备份原文件为 *.orig; 幂等可重复执行.
          #      注: MTK_PLATFORM=mt6873 不编译 base/power/mt6785/*.c, 故改头不影响定义端.
          python3 ../action-repo/flash/fix_gpufreq_mt6785_shim.py .
          # 11e) larb-port 宏重定义 (mt6873 结构性, 与 gpufreq 同类): 公开树默认把
          #      MTK_PLATFORM 解析为 mt6853, 驱动经 smi_pmqos.h -> <smi_port.h> 实际拉进
          #      include/dt-bindings/memory/mt6853-larb-port.h, 而 mt6873 驱动又直接包含
          #      mt6873-larb-port.h; 两文件各有独立文件级 guard 但定义大量同名 M4U_PORT_*
          #      宏(值不同)且无 per-macro 守卫 -> 同一 TU 同时包含即 -Werror 宏重定义,
          #      波及 disp/vdec/venc/m4u/iommu 等一切走 <smi_port.h> 链的 mt6873 驱动.
          #      修复: 把 mt6853-larb-port.h 改写为对 mt6873-larb-port.h 的薄转发层
          #      (mt6873 头自带 guard, 最终同名宏只定义一次, 免疫 -I 顺序). 原文件备份 .orig, 幂等.
          python3 ../action-repo/flash/fix_larb_port_shim.py .
          # 11f) tcpc_bomb (USB Type-C PD) 驱动缺失 include path:
          #     tcpc_bomb/inc/pd_dpm_pdo_select.h:18 做 #include "inc/tcpci.h", 而该驱动
          #     大量头文件均用 "inc/..." 形式, 期望 -I 含 .../typec/tcpc_bomb 父目录以
          #     解析到 tcpc_bomb/inc/tcpci.h (该文件在公开树中实测存在). 但 tcpc_bomb/
          #     Makefile 无任何 ccflags, 父级 typec/Makefile 仅 subdir-ccflags-y +=
          #     -I.../typec/inc (不含 tcpc_bomb), 故 Clang 报 'inc/tcpci.h' file not found.
          #     修复: 给 tcpc_bomb/Makefile 追加 ccflags-y += -I$(srctree)/.../tcpc_bomb,
          #     一次性让所有 "inc/..." 包含正确解析. 幂等 (marker 已存在则跳过).
          python3 ../action-repo/flash/fix_tcpc_bomb_incpath.py .
          # 11g) 链接期桩: 被禁用子系统的悬空引用 (ION / charger / SWPM / PPM).
          #      defconfig 关闭了 ION/MTK_CHARGER/MTK_SWPM 及 ppm_v3 平台功耗模块, 但其
          #      调用方(Mali GPU / apusys / USB-PD / boost / thermal)仍编入 vmlinux, 链接期
          #      报 undefined reference. 把 atom_link_shims.c 拷入驱动树并注册 obj-y, 提供
          #      安全的 no-op 桩 (指针型返 ERR_PTR, 标量型返 0), 调用方 IS_ERR/NULL 检查
          #      优雅降级, 设备仍可从 DISP 出 logo 启动. 幂等 (marker 已存在则跳过).
          python3 ../action-repo/flash/fix_link_stubs.py . ../action-repo
          # 12) 充电/USB-PD 双 dir (charger_bomb/ ti_bomb) 缺 USB-PD / TCPC 厂商头
          #     (struct tcp_ny_uvdm / tcpc_dev_get_by_name / usbpd_mi_vdm_received_cb),
          #     编译期报 incomplete type / implicit declaration / conflicting types.
          #     二者非启动必需 (充电由 vendor 分区/ABL 处理), 注释父 Makefile 的
          #     obj-$(CONFIG_*) += charger_bomb/ / ti_bomb/ 行跳过编译 (双保险见 defconfig 步骤).
          for mk in $(grep -rl 'charger_bomb' . 2>/dev/null); do
            sed -i '/^obj-.*charger_bomb/s/^/#/' "$mk"
          done
          for mk in $(grep -rl 'ti_bomb' . 2>/dev/null); do
            sed -i '/^obj-.*ti_bomb/s/^/#/' "$mk"
          done

      - name: 下载 Clang r383902 (与原厂 4.14.186-perf 同源自 AOSP, clang 11.0.1)
        run: |
          mkdir -p "$HOME/clang"
          curl -L --max-time 300 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: 集成 KernelSU (SukiSU-Ultra nongki, 来自本仓库 susu.tar.gz)
        if: ${{ github.event.inputs.WITH_KSU != 'false' }}
        run: |
          cd kernel
          rm -rf KernelSU
          SU_SRC=$(tar -tzf ../action-repo/susu.tar.gz | head -1 | cut -d/ -f1)
          tar -xzf ../action-repo/susu.tar.gz
          mkdir -p KernelSU
          cp -a "$SU_SRC/." KernelSU/
          # 手动挂载进内核构建系统（nongki 不自带钩子，须显式挂）
          rm -rf drivers/kernelsu
          ln -sfn "../KernelSU/kernel" drivers/kernelsu
          if ! grep -q 'kernelsu/' drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          fi
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            python3 - <<'PY'
          import os
          p = "drivers/Kconfig"
          lines = open(p).read().splitlines(True)
          idx = max(i for i, l in enumerate(lines) if l.strip() == "endmenu")
          lines.insert(idx, 'source "drivers/kernelsu/Kconfig"\n')
          open(p, "w").writelines(lines)
          PY
          fi
          ls -l drivers/kernelsu/Makefile drivers/kernelsu/Kconfig

      - name: 应用 Clang 编译修复 (atom-sukisu 已验证配方)
        run: |
          cd kernel
          # 1) 顶层 Makefile 497 行: 注释 -no-integrated-as, 改用 integrated assembler
          sed -i 's/-no-integrated-as/#-no-integrated-as/' Makefile
          # 2) vdso gettimeofday.S: 去掉 clock_gettime_return 后的逗号 (3 处 call site, 缺失则跳过)
          [ -f arch/arm64/kernel/vdso/gettimeofday.S ] && \
            sed -i 's/clock_gettime_return, shift=1/clock_gettime_return shift=1/g' arch/arm64/kernel/vdso/gettimeofday.S || true
          # 3) connectivity Makefile: unlink -> rm -rf, ln -s -> ln -snf (mt6873-dev 布局可能不同, 缺失则跳过)
          [ -f drivers/misc/mediatek/connectivity/Makefile ] && \
            sed -i 's/$(shell unlink/$(shell rm -rf/g; s/ln -s /ln -snf /g' drivers/misc/mediatek/connectivity/Makefile || true
          # 4) AES 汇编补丁
          python3 ../action-repo/flash/patch_aes.py
          # 5) cpuidle-mediatek.c: 同目录头文件改引号 (缺失则跳过)
          [ -f drivers/cpuidle/cpuidle-mediatek.c ] && \
            sed -i 's|#include <dt_idle_states.h>|#include "dt_idle_states.h"|' drivers/cpuidle/cpuidle-mediatek.c || true
          # 6) 全局: 尖括号引用且同目录存在的本地头文件改引号
          python3 ../action-repo/flash/fix_angle_includes.py .
          # 6c) 单段尖括号本地头 (<name>, 无 '/') -> 改写为相对路径引号包含。
          #     上游 MTK 树大量驱动用尖括号包含本地头, 对应 Makefile 未加 -I$(src),
          #     Clang 报 'file not found with <angled> include; use quotes instead'。
          #     覆盖同目录 (helio-dvfsrc-qos.h) 与跨目录 (sspm/mt6873/*.h 包含 v2/*.h) 整类;
          #     候选仅限 drivers/techpack/vendor 下的 .h, 不碰 include/arch/usr 系统包含根。
          python3 ../action-repo/flash/fix_local_angle_includes.py .
          # 6b) 子目录文件用引号包含"父目录/兄弟目录"头文件 (如 ion/mtk/ion_drv.h 的 "ion.h"、
          #     lpm suspend 的 "mt6873.h")：Clang 下 -I 未含父目录 → file not found。
          #     在被包含文件所在目录建符号链接指向真实头文件(非复制, 避免链接头自身相对包含错位)。
          python3 ../action-repo/flash/fix_parent_quote_includes.py .
          # 6d) gpufreq 还原: fix_local_angle_includes.py 可能把单段尖括号 <mtk_gpufreq.h>
          #     改写为相对路径 "../mt6785/mtk_gpufreq.h", 使 TU 直接拉入 mt6785 旧头
          #     (与 v1 链重定义). include/mtk_gpufreq.h 已(步骤#11)只走 v1 链, 故此处
          #     把一切 mt6785 mtk_gpufreq.h 引用还原为 <mtk_gpufreq.h>.
          find . -type f \( -name '*.c' -o -name '*.h' \) -exec sed -i \
            -e 's|"../mt6785/mtk_gpufreq.h"|<mtk_gpufreq.h>|g' \
            -e 's|"mt6785/mtk_gpufreq.h"|<mtk_gpufreq.h>|g' \
            -e 's|<mt6785/mtk_gpufreq.h>|<mtk_gpufreq.h>|g' \
            {} +
          # 7) MTK trace 头文件 TRACE_INCLUDE_PATH (Clang 兼容)
          python3 ../action-repo/flash/fix_trace_include_path.py .
          # 8) 缺失厂商固件打桩
          python3 ../action-repo/flash/stub_missing_firmware.py .
          # 9) 缺失引号头文件自动解析 (mt_iommu.h 等)
          python3 ../action-repo/flash/fix_missing_quote_includes.py .
          # 10) SukiSU syscall_fn_t 在 arm64 上未定义
          python3 ../action-repo/flash/fix_sukisu_syscall_fn_t.py .
          # 11) 4.14 缺 MODULE_IMPORT_NS 宏
          python3 ../action-repo/flash/fix_module_import_ns.py .
          # 12) 全局(drivers/)禁用 CONFIG_MEDIATEK_DRAMC 相关代码块(缩减内核策略):
          #     上游 mt6873 树缺失 drivers/misc/mediatek/dramc/mt6873/dramc.h
          #     (应声明 mtk_dramc_get_ddr_type / get_steps_freq / get_data_rate 及 TYPE_LPDDR* 枚举),
          #     而 CONFIG_MEDIATEK_DRAMC(带E, 孤儿符号)被开启, 致所有引用缺失符号的文件
          #     (helio-dvfsrc-v3/*, cm_mgr_v1/mt6873/mtk_cm_mgr_platform.c 等) 隐式声明/未声明错误。
          #     逐一 sed 已不够, 故对 drivers/ 全部 .c/.h 做三类替换, 强制走各文件自带
          #     stub / #else 分支, 规避缺失平台头。不碰 CONFIG_MTK_DRAMC(不带E)。
          #       ① #ifdef  CONFIG_MEDIATEK_DRAMC -> #if 0
          #       ② #ifndef CONFIG_MEDIATEK_DRAMC -> #if 1
          #       ③ defined(CONFIG_MEDIATEK_DRAMC) -> 0  (覆盖 #if defined() / #elif / #if !defined() 等)
          find drivers -type f \( -name '*.c' -o -name '*.h' \) -exec sed -i \
            -e 's|#ifdef CONFIG_MEDIATEK_DRAMC|#if 0 /* mt6873/dramc.h missing; use local stub */|g' \
            -e 's|#ifndef CONFIG_MEDIATEK_DRAMC|#if 1 /* use local stub */|g' \
            -e 's|defined(CONFIG_MEDIATEK_DRAMC)|0|g' \
            {} +
          # 12.5) DCM 修复 (鲁棒版): 上游 MTK DCM 头用项目宏守卫, 缺对应平台宏 -> #error 致编译失败.
          #       干净头 include/dcm_v1/mtk_dcm.h 仅含函数声明, 无 #error.
          #       策略: 在 drivers/ 内查找含该 #error 守卫的 mtk_dcm.h, 一律用干净头覆盖;
          #       干净头缺失则跳过. 同时诊断打印 dcm 头与 Makefile 供日志复盘.
          echo "===== dcm_v1/mt6873/mtk_dcm.h ====="; sed -n '1,30p' drivers/misc/mediatek/base/power/dcm_v1/mt6873/mtk_dcm.h 2>/dev/null || echo "(不存在)"
          echo "===== dcm_v1/Makefile ====="; cat drivers/misc/mediatek/base/power/dcm_v1/Makefile 2>/dev/null || true
          echo "===== dcm_v1/mt6873/Makefile ====="; cat drivers/misc/mediatek/base/power/dcm_v1/mt6873/Makefile 2>/dev/null || true
          SRC=drivers/misc/mediatek/base/power/include/dcm_v1/mtk_dcm.h
          if [ -f "$SRC" ]; then
            hits=$(grep -rl 'NO corresponding project of mtk_dcm.h' drivers/ 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "$hits" | while read -r f; do cp -f "$SRC" "$f"; echo "[ok] dcm: 用干净头覆盖 $f"; done
            else
              echo "[i] 未找到含 #error 守卫的 mtk_dcm.h (当前上游可能已无此问题)"
            fi
            # 防御: 将干净头铺到 dcm_v1/mt6873/ 与 dcm_v1/ 下, 防止引号包含/旧版阴影头解析到错误头
            [ -d drivers/misc/mediatek/base/power/dcm_v1/mt6873 ] && \
              cp -f "$SRC" drivers/misc/mediatek/base/power/dcm_v1/mt6873/mtk_dcm.h && \
              echo "[ok] dcm: 铺干净头到 dcm_v1/mt6873/mtk_dcm.h"
          else
            echo "[W] 干净头 $SRC 不存在, 跳过 dcm 修复"
          fi
          # 12) 4.14 KSU 通用适配 (pgtable.h / ksys_ / strncpy_from_user_nofault)
          python3 ../action-repo/flash/fix_ksu_414_generic.py .
          # 13) lsm_hook.c 在 4.14 的适配 (hlist -> list_head)
          python3 ../action-repo/flash/fix_lsm_hook_414.py .

      - name: 集成 SUSFS (gitlab.com/simonpunk/susfs4ksu)
        if: ${{ github.event.inputs.WITH_SUSFS != 'false' }}
        run: |
          cd kernel
          git clone --depth 1 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs_src
          KP="../susfs_src/kernel_patches"
          # (a) 拷贝 SUSFS 核心源文件
          cp -a "$KP/fs/susfs.c"            fs/susfs.c            2>/dev/null || echo "[W] copy fs/susfs.c failed"
          cp -a "$KP/include/linux/susfs.h" include/linux/susfs.h 2>/dev/null || echo "[W] copy susfs.h failed"
          # (b) 内核侧补丁：VFS 钩子 + fs/Makefile 条目
          patch -p1 --forward < "$KP/50_add_susfs_in_kernel-4.14.patch" 2>&1 | grep -iE "fail|rej" || true
          # (c) KernelSU 侧补丁
          patch -p1 --forward -d KernelSU < "$KP/KernelSU/10_enable_susfs_for_ksu.patch" 2>&1 | grep -iE "fail|rej" || true
          # (d) 消除 kernel_compat.h 宏与函数同名冲突
          sed -i -E 's/^(\s*)(int ksu_access_ok\(const void \*addr, unsigned long size\) \{)/\1#undef ksu_access_ok\n\1\2/' \
            KernelSU/kernel/kernel_compat.c
          # (e) 手动补 selinux/rules.c 的 zygote unmount 规则 (SUSFS try_umount 所需)
          python3 - <<'PY' 2>/dev/null || true
          p = "KernelSU/kernel/selinux/rules.c"
          try:
              s = open(p).read()
              if "labeledfs" not in s:
                  anchor = 'ksu_allow(db, "system_server", KERNEL_SU_DOMAIN, "process", "sigkill");'
                  ins = anchor + "\n\n#ifdef CONFIG_KSU_SUSFS\n\tksu_allow(db, \"zygote\", \"labeledfs\", \"filesystem\", \"unmount\");\n#endif\n"
                  s = s.replace(anchor, ins, 1)
                  open(p, "w").write(s)
                  print("    [ok] selinux SUSFS 规则已补入")
          except Exception as e:
              print("    [W] selinux 规则补入失败:", e)
          PY
          # (f) 补 path_umount()：atom 4.14.186 厂商树未提供，fs/susfs.c 需要
          if grep -q "int path_umount(struct path \*path, int flags)" fs/namespace.c; then
            echo "    [skip] path_umount 已存在"
          else
            cat >> fs/namespace.c <<'EOF'

          #ifdef CONFIG_KSU_SUSFS
          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	return do_umount(mnt, flags);
          }
          EXPORT_SYMBOL(path_umount);
          #endif
          EOF
            echo "    [ok] path_umount() 已补入 fs/namespace.c"
          fi
          # (g) 手动补 faccessat 的 SUS_PATH 钩子
          python3 - <<'PY2' 2>/dev/null || echo "    [W] faccessat SUS_PATH 钩子补入失败"
          import re
          p = "fs/open.c"
          s = open(p).read()
          m = re.search(r'SYSCALL_DEFINE3\(faccessat.*?\n\{\n(.*?)\n\}', s, re.S)
          if m:
              fn = m.group(0)
              if 'susfs_sus_path_by_filename' not in fn:
                  fn2 = fn.replace('unsigned int lookup_flags = LOOKUP_FOLLOW;\n',
                      'unsigned int lookup_flags = LOOKUP_FOLLOW;\n'
                      '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n'
                      '\tstruct filename* fname;\n'
                      '\tint status;\n'
                      '\tint error;\n'
                      '\tfname = getname_safe(filename);\n'
                      '\tstatus = susfs_sus_path_by_filename(fname, &error, SYSCALL_FAMILY_ALL_ENOENT);\n'
                      '\tputname_safe(fname);\n'
                      '\tif (status) {\n'
                      '\t\treturn error;\n'
                      '\t}\n'
                      '#endif\n', 1)
                  s = s[:m.start()] + fn2 + s[m.end():]
                  open(p, "w").write(s)
                  print("    [ok] faccessat SUS_PATH 钩子已补入")
              else:
                  print("    [skip] faccessat 已有 SUS_PATH 钩子")
          else:
              print("    [W] 未找到 faccessat 函数")
          PY2

      - name: 生成 defconfig 并开启 KSU / SUSFS / 关闭 APPENDED_DTB
        run: |
          cd kernel
          # 当 WITH_KSU=false 时, 上游源码树的 drivers/Kconfig 可能已含
          # source "drivers/kernelsu/Kconfig" 行 (但 drivers/kernelsu/ 目录不存在),
          # 导致 make olddefconfig 找不到文件而失败. 移除该行.
          if [ "${{ github.event.inputs.WITH_KSU }}" = "false" ]; then
            if grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig 2>/dev/null; then
              sed -i '\#drivers/kernelsu/Kconfig#d' drivers/Kconfig
              echo "[fix] removed 'source drivers/kernelsu/Kconfig' from drivers/Kconfig (WITH_KSU=false)"
            fi
            if grep -q 'kernelsu' drivers/Makefile 2>/dev/null; then
              sed -i '/kernelsu/d' drivers/Makefile
              echo "[fix] removed kernelsu line from drivers/Makefile (WITH_KSU=false)"
            fi
          fi
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          make ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- MTK_PLATFORM=mt6873 \
            "${{ github.event.inputs.DEFCONFIG || 'vendor/atom_user_defconfig' }}"
          # KernelSU 所需 (受 WITH_KSU 控制)
          if [ "${{ github.event.inputs.WITH_KSU }}" != "false" ]; then
            scripts/config --enable CONFIG_KSU
            scripts/config --enable CONFIG_KPROBES
            scripts/config --enable CONFIG_KALLSYMS
            scripts/config --enable CONFIG_KALLSYMS_ALL
          fi
          # SUSFS (默认开)
          if [ "${{ github.event.inputs.WITH_SUSFS }}" != "false" ]; then
            scripts/config --enable CONFIG_KSU_SUSFS
            scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
            scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
            scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT
          else
            scripts/config --disable CONFIG_KSU_SUSFS || true
          fi
          # pstore/ramoops (取证用, 默认开): 全量开启, 让任何崩溃(含早期 oops/panic)
          # 都能落盘到 ramoops 保留区(与原厂同地址 0x4d010000), 重启进原厂内核后
          # 可在 /sys/fs/pstore 读到本次 KSU 内核的崩溃现场, 终结"静默重启无日志"。
          if [ "${{ github.event.inputs.WITH_PSTORE }}" != "false" ]; then
            scripts/config --enable CONFIG_PSTORE
            scripts/config --enable CONFIG_PSTORE_CONSOLE
            scripts/config --enable CONFIG_PSTORE_PMSG
            scripts/config --enable CONFIG_PSTORE_RAM
            scripts/config --enable CONFIG_PSTORE_COMPRESS || true
            scripts/config --enable CONFIG_PSTORE_DEFLATE_COMPRESS || true
            scripts/config --enable CONFIG_PSTORE_ZLIB_COMPRESS || true
          fi
          # 【关键健壮性】关闭 PANIC_ON_OOPS: 原厂=n。开启后任何本可恢复的 oops 都会
          # 立即升级为 panic 静默重启(屏幕来不及输出), 完全吻合"只有 logo、无文字、重启"。
          # 关闭后遇到同类 oops 仅打 WARNING 继续跑, 多数情况能正常开机。
          scripts/config --disable CONFIG_PANIC_ON_OOPS || true
          # 【关键健壮性】对齐原厂: 关闭 ARM64 指针认证(PTR_AUTH)/BTI 分支保护。
          # 若原厂未开启而本树默认开启, 早期代码会发出 PAC/BTI 指令但 BL/EL2 未设密钥 ->
          # start_kernel 前后同步异常静默重启。关闭后整类风险消除(调试内核不需要该安全特性)。
          scripts/config --disable CONFIG_ARM64_PTR_AUTH || true
          scripts/config --disable CONFIG_ARM64_BTI || true
          scripts/config --disable CONFIG_ARM64_BTI_KERNEL || true
          # 【关键健壮性】关闭 CFI (Control Flow Integrity)。
          #   原厂开启了 CONFIG_CFI_CLANG=y + CFI_CLANG_SHADOW=y, 且
          #   CONFIG_CFI_PERMISSIVE 未开启 = **严格模式**: 任何间接调用的函数指针签名
          #   不匹配就 trap -> panic。而本构建为链接通过, 用 gen_link_stubs.py 生成了
          #   一批 weak 桩, 其签名统一为 `long NAME(void)`(与原函数参数表不同)。
          #   内核里大量回调经由 ops 函数指针发起, 一旦命中被桩替换的符号便触发 CFI
          #   trap; 叠加 PANIC_ON_OOPS=y 即"屏上无输出、直接重启"= 卡 Redmi logo。
          #   调试内核不需要 CFI, 关闭以消除整类风险 (桩本身已是"假实现", CFI 无意义)。
          scripts/config --disable CONFIG_CFI_CLANG || true
          scripts/config --disable CONFIG_CFI_CLANG_SHADOW || true
          scripts/config --disable CONFIG_CFI || true
          # 【对齐原厂】MODULES: vendor 分区的 .ko (WiFi/触摸/GPU 等) 依赖内核模块支持。
          #   defconfig 未显式声明, 若由 Kconfig 默认解析为 n, 模块无法加载。
          scripts/config --enable CONFIG_MODULES || true
          scripts/config --enable CONFIG_MODULE_UNLOAD || true
          scripts/config --enable CONFIG_MODULES_USE_ELF_RELA || true
          # 【对齐原厂】VA_BITS=39 (4K pages 下本就是默认, 显式固化以防解析漂移)
          scripts/config --enable CONFIG_ARM64_VA_BITS_39 || true
          scripts/config --disable CONFIG_ARM64_VA_BITS_48 || true
          scripts/config --set-val CONFIG_ARM64_VA_BITS 39 || true
          # 【配置自洽 / 二分法诊断】禁用 Mali GPU 驱动。
          #   本树已禁用 ION(CONFIG_ION 关闭, 因公开树缺 mtk/ion.h 与 uapi/ion.h, 无法启用),
          #   但 CONFIG_MTK_GPU_SUPPORT 仍为 y -> Mali(kbase, valhall r25p0) 被编入却只能
          #   拿到 ion_* 的 weak 桩(返回 ERR_PTR)。GPU 初始化依赖 ION 分配内存, 一旦 probe
          #   时挂住即触发硬件 watchdog 重启, 表现为"卡 Redmi logo 后重启"。
          #   实测 Image 内 kbase 符号 205 处、mali 247 处, 而 ion_drv_probe 为 0, 自相矛盾。
          #   禁用 GPU 让配置自洽; Android 可回退软件渲染启动, 足以验证内核能否开机。
          scripts/config --disable CONFIG_MTK_GPU_SUPPORT || true
          scripts/config --disable CONFIG_MTK_GPU_COMMON_DVFS_SUPPORT || true
          scripts/config --disable CONFIG_MTK_GPU_OPP_STATS_SUPPORT || true
          scripts/config --disable CONFIG_MTK_GPU_SWPM_SUPPORT || true
          scripts/config --disable CONFIG_MTK_PTPOD_GPU || true
          # 【头号嫌疑修复】禁用 KASLR (CONFIG_RANDOMIZE_BASE)。
          #   实测(2026-09-04): 已排除 DTB 传递(原厂同为纯 Image.gz 无 appended DTB)、
          #   GPU/ION 矛盾(禁 GPU 后仍 bootloop)、PANIC_ON_OOPS/CFI。pstore 全量开启后
          #   KSU 内核仍零 printk 输出 + expdb 显示 "rst from: kernel" + AP watchdog 咬死
          #   => 内核 hang 在 console_init 之前的 start_kernel 前半段/head.S 阶段。
          #   LLD 链接的 4.14 arm64 内核, KASLR 在 head.S __primary_switch 做重定位,
          #   LLD 的 RELA/偏移处理与原厂(也是 LLD 11)存在版本组合差异时会在该阶段
          #   静默挂死 —— 与全部症状吻合。禁用 KASLR 消除该整段代码路径。
          scripts/config --disable CONFIG_RANDOMIZE_BASE || true
          # 【次嫌疑】禁用 LTO: defconfig 为 LTO_CLANG=y(无 THINLTO), 与原厂
          #   (LTO+THINLTO) 组合不同, full-LTO 下重定位/符号地址布局差异同样可能
          #   影响早期代码。禁用后走常规 .o 链接, 布局更接近非-LKD 常规构建。
          scripts/config --disable CONFIG_LTO_CLANG || true
          scripts/config --disable CONFIG_LTO || true
          scripts/config --disable CONFIG_THINLTO || true
          # 【根因新假设 - 头号嫌疑】禁用 KASLR (CONFIG_RANDOMIZE_BASE)。
          #   实测 KSU 内核刷入后: expdb 显示 "rst from: kernel" + "AP Watchdog"(内核 hang 被看门狗咬),
          #   ramoops/console-ramoops 262KB 全是刷入前的原厂会话日志(KSU 内核零 printk 输出),
          #   expdb kedump 用原厂偏移(0x4ab808)读 KSU 内核 __log_buf 读到全零(布局不同)。
          #   => KSU 内核死在 console_init 之前, 无任何输出。
          #   "LLD 链接的 4.14 arm64 内核 + KASLR" 是该症状的经典根因:
          #   KASLR 重定位代码在 head.S 的 __primary_switch 前后执行, 恰好早于 console 初始化,
          #   若 LLD 生成的 RELA 重定位表与 kaslr_early 代码不兼容, 会在此 hang/同步异常, 零输出。
          #   【已证伪 2026-09-05】原厂 /proc/version 实测:
          #     Android (6443078 based on r383902) clang version 11.0.1 + LLD 11.0.1
          #   => 原厂用的就是我们这套 clang/LLD, "原厂用 GCC" 是错误假设, 此风险点不成立。
          #   禁用 KASLR 保留(实测禁用后仍 bootloop, 非根因, 但无害)。
          #   调试内核不需要 KASLR, 关闭以消除该整类早期风险。
          scripts/config --disable CONFIG_RANDOMIZE_BASE || true
          # 【次嫌疑】禁用 LTO: defconfig 有 CONFIG_LTO_CLANG=y 但无 THINLTO, 与原厂
          #   (LTO=y + THINLTO=y) 配置不同; full LTO 在 clang/LLD 4.14 上亦有已知早期问题。
          #   LTO 是 Kconfig choice, 用 LTO_NONE 显式占位。
          scripts/config --enable CONFIG_LTO_NONE || true
          scripts/config --disable CONFIG_LTO_CLANG || true
          scripts/config --disable CONFIG_LTO || true
          scripts/config --disable CONFIG_THINLTO || true
          # 关闭 STRONG stack-protector: 公开树 fstb.c 在 clang STRONG 下产生
          # R_AARCH64_LDST64_ABS_LO12_NC 8字节对齐错误(mtk_fstb_init 函数),
          # 原厂版本 fstb.c 可能不同故能开 STRONG. 公开树只能用 NONE.
          scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG || true
          # 关键: 关闭 appended DTB, 产出纯 Image.gz (设备用 dtbo 分区提供 DTB)
          scripts/config --disable CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          # 禁用 FTS/FocalTech 触摸驱动 (厂商私有固件 blob 缺失); 实机固件由 vendor 分区加载
          scripts/config --disable CONFIG_TOUCHSCREEN_FTS || true
          scripts/config --disable CONFIG_TOUCHSCREEN_FTS_FOD || true
          # 缩减公开树缺失厂商头文件的子系统
          # SWPM: 已在修补步骤 4 整体剔除 swpm_v1 (mt6873 公开树缺平台头且兄弟头不兼容); 此处关 GPU_SWPM 降运行期风险
          scripts/config --disable CONFIG_MTK_SWPM || true
          scripts/config --disable CONFIG_MTK_GPU_SWPM_SUPPORT || true
          # 相机/CCU: 相关头 (met_events_camsys.h 等) 缺失, 已从父 Makefile 剔除 cameraisp; 一并关配置
          scripts/config --disable CONFIG_MTK_IMGSENSOR || true
          scripts/config --disable CONFIG_MTK_CCU || true
          scripts/config --disable CONFIG_MEDIA_CAMERA_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_RSC_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_DPE_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_TSF_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_FD_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_WPE_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_OWE_SUPPORT || true
          scripts/config --disable CONFIG_MTK_CAMERA_ISP_MFB_SUPPORT || true
          scripts/config --unset CONFIG_CUSTOM_KERNEL_IMGSENSOR || true
          # 关闭 wlan/bt/fm/gps 一体编译 (CONFIG_WLAN_DRV_BUILD_IN): 该 MTK 闭源驱动
          # 在 Clang 下存在大量 incomplete-type / -Wvisibility 真实错误, 且与启动无关;
          # 缩减内核策略下关闭, 仅保留无条件编译的 connadp 适配层 (不引用 wlan 符号).
          scripts/config --disable CONFIG_WLAN_DRV_BUILD_IN || true
          # 关键: 强制 MTK_PLATFORM=mt6873 (公开重建树默认/错误地解析为 mt6853,
          #   导致 smi/smi_port.h 链拉进 mt6853-larb-port.h, 与 mmdvfs/mdp 直接包含的
          #   mt6873-larb-port.h 宏重名 -> -Werror 重定义; 同时影响 disp/vdec/venc/m4u/iommu 等).
          scripts/config --set-str CONFIG_MTK_PLATFORM "mt6873" || true
          # ION 暂存驱动在公开树缺 mtk/ion.h 与 uapi/ion.h (404), 无法编译 -> 关闭.
          #   (ION 为 deprecated staging, KernelSU/SUSFS 不依赖; 实机图形缓冲由 vendor 分区驱动提供)
          scripts/config --disable CONFIG_ION || true
          scripts/config --disable CONFIG_STAGING_ION || true
          scripts/config --disable CONFIG_MTK_ION || true
          scripts/config --disable CONFIG_MTK_ION_DEBUG || true
          # 音频 DSP 双核(A/B): 缩减内核未开 ADSP_B, 但 audio_ipi/audio_dsp 代码无条件引用
          #   ADSP_B_ID / ADSP_B_IPI_DMA_MEM_ID (仅 CONFIG_MTK_AUDIO_ADSP_B 下定义) -> undeclared 错误。
          #   音频 DSP 非启动必需, 关闭以整体编译掉这些代码路径
          #   (audio_ipi_platform.c 的 HIFI3_B 块由 CONFIG_MTK_AUDIODSP_SUPPORT 守卫;
          #    dsp-platform-mem-control.o 由 CONFIG_SND_SOC_MTK_AUDIO_DSP 门控)。
          scripts/config --disable CONFIG_MTK_AUDIODSP_SUPPORT || true
          scripts/config --disable CONFIG_MTK_AUDIO_CM4_SUPPORT || true
          scripts/config --disable CONFIG_MTK_AUDIO_ADSP_B || true
          scripts/config --disable CONFIG_SND_SOC_MTK_AUDIO_DSP || true
          # 充电/USB-PD: charger_bomb / ti_bomb 缺厂商头, 已在修补步骤 12 注释其 Makefile 编译;
          #   此处一并关配置 (双保险, 防止 CONFIG_MTK_CHARGER 被 Kconfig select 强制开启).
          scripts/config --disable CONFIG_MTK_CHARGER || true
          scripts/config --disable CONFIG_BQ2597X_CHARGE_PUMP || true
          make ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- MTK_PLATFORM=mt6873 olddefconfig

      - name: 编译内核 (纯 Image.gz, KSU+SUSFS 已内建)
        run: |
          cd kernel
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          # 【关键】4.14 老内核 + clang 的告警降级配方 (沿用 build.sh 已验证配方)。
          #   此前本 workflow 未设 KCFLAGS, 导致任何 implicit-function-declaration 之类
          #   的老代码告警都被内核 -Werror 放大成编译错误并中断整轮构建
          #   (实例: drivers/misc/mediatek/base/power/cpumssv_v1/mt6873/mtk_mssv.c
          #    的 udi_reg_read/udi_reg_write 隐式声明 -> run 33834010586 失败)。
          #   注意: clang 下 implicit-int / implicit-function-declaration 默认即为 error,
          #   必须用 -Wno-... 直接关闭, -Wno-error=... 对它们无效。
          #   -Wno-error 兜底把所有告警降级为警告, 避免 15 分钟一轮的构建反复卡在告警上。
          export KCFLAGS="-Wno-implicit-function-declaration -Wno-implicit-int \
            -Wno-error=incompatible-pointer-types -Wno-error=array-bounds \
            -Wno-error=format -Wno-error=enum-conversion \
            -Wno-error=address-of-packed-member -Wno-unknown-warning-option \
            -Wno-error -Wno-unused-but-set-variable -Wno-unused-variable \
            -Wno-unused-function -Wno-error=unused-but-set-variable \
            -fno-builtin-stpcpy -fno-builtin-stpncpy"
          echo "KCFLAGS=$KCFLAGS"
          # 自愈链接循环: 我们按"缩减内核"策略禁用了若干 vendor 子系统(ION/charger/
          # AUDIODSP/SWPM/ppm_v3), 但公开树里它们的调用方仍被编入 vmlinux, 链接期必然
          # 出现 undefined symbol. 过去是"链接->看错误->手工补桩->再推一次 CI", 每轮
          # ~20 分钟(打地鼠). 这里把该循环搬进【同一次构建】: 链接失败且原因是缺符号
          # 时, 自动为残余符号生成 weak 桩并立即重链, 最多 3 轮.
          # --error-limit=0 关掉 lld 默认只报 20 条的截断, 确保一轮就拿到完整符号集.
          MK_ARGS="ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- MTK_PLATFORM=mt6873"
          set +e
          for attempt in 1 2 3; do
            echo "==================== build attempt $attempt ===================="
            make $MK_ARGS LDFLAGS_vmlinux="--error-limit=0" Image.gz -j"$(nproc)" 2>&1 \
              | tee "/tmp/build_attempt_${attempt}.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              echo "== 构建成功 (attempt $attempt) =="
              break
            fi
            if ! grep -q "undefined symbol:" "/tmp/build_attempt_${attempt}.log"; then
              echo "== 失败原因不是链接缺符号, 不再重试 (见上方编译错误) =="
              break
            fi
            echo "== 链接期缺符号, 自动生成 weak 桩后重链 =="
            python3 ../action-repo/flash/gen_link_stubs.py \
              "/tmp/build_attempt_${attempt}.log" . \
              || { echo "== 无新符号可补, 停止重试 =="; break; }
          done
          set -e
          if [ ! -f arch/arm64/boot/Image.gz ]; then
            echo "::error::Image.gz 未生成, 构建失败"
            exit 1
          fi
          echo "== 最终产物 =="
          ls -lh arch/arm64/boot/Image.gz

      - name: 校验产物 Image.gz (纯内核, 无 appended DTB) + KSU/SUSFS 是否存在
        env:
          WITH_KSU: ${{ github.event.inputs.WITH_KSU }}
          WITH_SUSFS: ${{ github.event.inputs.WITH_SUSFS }}
        run: |
          cd kernel
          ls -lh arch/arm64/boot/Image.gz
          python3 - <<'PY'
          import gzip, os
          data = open('arch/arm64/boot/Image.gz','rb').read()
          raw = gzip.decompress(data)
          print("decompressed kernel size:", len(raw))
          print("appended DTB present:", b'\xd0\x0d\xfe\xed' in raw)
          print("ARM64 magic @56:", raw[56:60] == b'ARM\x64')
          print("KernelSU strings:", raw.count(b'KernelSU'))
          print("susfs strings:", raw.lower().count(b'susfs'))
          # 通用断言: 镜像必须是合法 ARM64 Image (无论是否含 KSU)
          assert raw[56:60] == b'ARM\x64', "NOT a valid ARM64 Image!"
          # KSU/SUSFS 字符串断言仅在对应功能开启时执行 (对照构建时跳过)
          if os.environ.get('WITH_KSU') != 'false':
              assert raw.count(b'KernelSU') > 0, "KernelSU NOT compiled in! (WITH_KSU=true)"
          else:
              print("[skip] WITH_KSU=false, 不校验 KernelSU 字符串")
          if os.environ.get('WITH_SUSFS') != 'false':
              assert raw.lower().count(b'susfs') > 0, "susfs NOT compiled in! (WITH_SUSFS=true)"
          else:
              print("[skip] WITH_SUSFS=false, 不校验 susfs 字符串")
          PY

      - name: 打包 AnyKernel3 (纯 Image.gz, 保留设备 ramdisk/dtbo)
        run: |
          ZIPNAME="atom-ksu-susfs-AnyKernel3.zip"
          rm -rf AK3 && mkdir -p AK3
          cp action-repo/ak3/anykernel.sh AK3/anykernel.sh
          cp action-repo/ak3/META-INF AK3/ -r
          cp action-repo/ak3/tools AK3/ -r
          cp kernel/arch/arm64/boot/Image.gz AK3/Image.gz
          cd AK3 && zip -r "../$ZIPNAME" . -x '*.git*'
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

      - name: 上传构建产物 (供 monitor 脚本下载)
        uses: actions/upload-artifact@v4
        with:
          name: atom-ksu-susfs-AnyKernel3
          path: atom-ksu-susfs-AnyKernel3.zip
