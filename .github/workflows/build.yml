name: Build atom KSU + SUSFS

on:
  workflow_dispatch:
    inputs:
      with_susfs:
        description: 'Include SUSFS (uncheck for KernelSU-only build)'
        type: boolean
        default: true
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl zip bison flex make bc \
            libssl-dev libncurses5-dev ccache

      - name: Build kernel
        env:
          WITH_SUSFS: ${{ github.event.inputs.with_susfs }}
        run: bash build.sh

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: atom-ksu-susfs-AnyKernel3
          path: atom-ksu-susfs-AnyKernel3.zip
          if-no-files-found: error
